name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install aiosecspy
        run: pip install -e "./aiosecspy[dev]"
      - name: Sync vendored package
        run: python scripts/sync_aiosecspy.py
      - name: Pytest
        run: pytest -q
      - name: Ruff (optional)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check aiosecspy custom_components/secspy tests
